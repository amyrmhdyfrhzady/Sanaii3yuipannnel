name: 3X-UI Persistent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xui:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssl git

      - name: Check backup secret
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          if [ -z "$XUI_BACKUP_KEY" ]; then
            echo "ERROR: XUI_BACKUP_KEY secret is not configured."
            exit 1
          fi

          mkdir -p .xui-backup

      - name: Check panel credentials
        env:
          XUI_PANEL_USERNAME: ${{ secrets.XUI_PANEL_USERNAME }}
          XUI_PANEL_PASSWORD: ${{ secrets.XUI_PANEL_PASSWORD }}
        run: |
          if [ -z "$XUI_PANEL_USERNAME" ]; then
            echo "ERROR: XUI_PANEL_USERNAME secret is not configured."
            exit 1
          fi

          if [ -z "$XUI_PANEL_PASSWORD" ]; then
            echo "ERROR: XUI_PANEL_PASSWORD secret is not configured."
            exit 1
          fi

          echo "Panel credentials are configured."

      - name: Install 3X-UI
        env:
          XUI_NONINTERACTIVE: "1"
          XUI_SSL_MODE: "none"
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/MHSanaei/3x-ui/main/install.sh \
            | sudo -E bash

      - name: Stop 3X-UI before restore
        run: |
          sudo systemctl stop x-ui || true

      - name: Restore previous configuration
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          set -e

          BACKUP=".xui-backup/x-ui-backup.tar.gz.enc"
          CHECKSUM=".xui-backup/x-ui-backup.sha256"

          if [ ! -f "$BACKUP" ]; then
            echo "=============================================="
            echo "No previous backup found."
            echo "This is the first 3X-UI run."
            echo "=============================================="
            exit 0
          fi

          if [ ! -f "$CHECKSUM" ]; then
            echo "ERROR: Backup checksum is missing."
            exit 1
          fi

          echo "Checking SHA-256..."

          sha256sum -c "$CHECKSUM"

          echo "Checksum OK."

          echo "Decrypting backup..."

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -in "$BACKUP" \
            -out /tmp/x-ui-backup.tar.gz \
            -pass "pass:$XUI_BACKUP_KEY"

          echo "Restoring configuration..."

          sudo rm -rf /etc/x-ui
          sudo mkdir -p /etc/x-ui

          sudo tar \
            -xzf /tmp/x-ui-backup.tar.gz \
            -C /

          sudo chown -R root:root /etc/x-ui

          if [ -d /root/cert ]; then
            sudo chown -R root:root /root/cert
          fi

          sudo rm -f /tmp/x-ui-backup.tar.gz

          echo "=============================================="
          echo "Previous configuration restored."
          echo "=============================================="

      - name: Set 3X-UI login credentials
        env:
          XUI_PANEL_USERNAME: ${{ secrets.XUI_PANEL_USERNAME }}
          XUI_PANEL_PASSWORD: ${{ secrets.XUI_PANEL_PASSWORD }}
        run: |
          set -e

          echo "Setting 3X-UI username and password..."

          sudo x-ui setting \
            -username "$XUI_PANEL_USERNAME" \
            -password "$XUI_PANEL_PASSWORD"

          echo "3X-UI login credentials configured."

      - name: Start 3X-UI
        run: |
          sudo systemctl enable x-ui
          sudo systemctl restart x-ui

          sleep 5

      - name: Get 3X-UI panel information
        run: |
          echo "=============================================="
          echo "3X-UI PANEL SETTINGS"
          echo "=============================================="

          sudo x-ui settings || true

          echo
          echo "=============================================="
          echo "3X-UI LOGIN CREDENTIALS"
          echo "=============================================="

          echo "Username:"
          echo "${{ secrets.XUI_PANEL_USERNAME }}"

          echo
          echo "Password:"
          echo "${{ secrets.XUI_PANEL_PASSWORD }}"

          echo
          echo "=============================================="
          echo "CONFIG FILES"
          echo "=============================================="

          sudo find /etc/x-ui -maxdepth 2 -type f -print

          echo
          echo "=============================================="
          echo "LISTENING PORTS"
          echo "=============================================="

          sudo ss -lntp | grep -E 'x-ui|LISTEN' || true

          echo
          echo "=============================================="
          echo "PUBLIC IP"
          echo "=============================================="

          curl -4 -s https://api.ipify.org
          echo

      - name: Check 3X-UI
        run: |
          echo "=============================================="
          echo "3X-UI STATUS"
          echo "=============================================="

          sudo systemctl --no-pager status x-ui || true

          echo
          echo "=============================================="
          echo "LISTENING PORTS"
          echo "=============================================="

          sudo ss -lntup || true

      - name: Start Cloudflare Quick Tunnel
        run: |
          set -e

          echo "=============================================="
          echo "INSTALLING CLOUDFLARED"
          echo "=============================================="

          curl -L \
            --fail \
            --show-error \
            --silent \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i /tmp/cloudflared.deb

          echo
          echo "=============================================="
          echo "STARTING CLOUDFLARE QUICK TUNNEL"
          echo "=============================================="

          nohup cloudflared tunnel \
            --url http://127.0.0.1:2053 \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > /tmp/cloudflared.pid

          echo "Waiting for Cloudflare Tunnel..."

          TUNNEL_URL=""

          for i in $(seq 1 30); do
            sleep 2

            TUNNEL_URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | tail -1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          echo
          echo "=============================================="
          echo "CLOUDFLARE PANEL URL"
          echo "=============================================="

          if [ -n "$TUNNEL_URL" ]; then
            echo "$TUNNEL_URL"
          else
            echo "ERROR: Cloudflare Tunnel URL was not detected."
            echo
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo
          echo "=============================================="
          echo "CLOUDFLARE TUNNEL STATUS"
          echo "=============================================="

          ps -p "$CLOUDFLARED_PID" || true

          echo
          echo "=============================================="
          echo "CLOUDFLARE LOG"
          echo "=============================================="

          tail -50 /tmp/cloudflared.log || true

      - name: Create initial backup
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          set -e

          sudo systemctl stop x-ui

          sudo rm -rf /tmp/xui-backup-work
          sudo rm -f /tmp/x-ui-backup.tar.gz

          sudo mkdir -p /tmp/xui-backup-work/etc
          sudo mkdir -p /tmp/xui-backup-work/root

          mkdir -p .xui-backup

          echo "Creating 3X-UI backup..."

          sudo cp -a /etc/x-ui \
            /tmp/xui-backup-work/etc/x-ui

          if [ -d /root/cert ]; then
            sudo cp -a /root/cert \
              /tmp/xui-backup-work/root/cert
          fi

          sudo tar \
            -czf /tmp/x-ui-backup.tar.gz \
            -C /tmp/xui-backup-work \
            .

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -salt \
            -in /tmp/x-ui-backup.tar.gz \
            -out .xui-backup/x-ui-backup.tar.gz.enc \
            -pass "pass:$XUI_BACKUP_KEY"

          sha256sum \
            .xui-backup/x-ui-backup.tar.gz.enc \
            > .xui-backup/x-ui-backup.sha256

          sudo rm -rf /tmp/xui-backup-work
          sudo rm -f /tmp/x-ui-backup.tar.gz

          sudo systemctl start x-ui

          echo "Initial backup completed."

      - name: Commit initial backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .xui-backup/

          if git diff --cached --quiet; then
            echo "No backup changes."
          else
            git commit -m "Update 3X-UI backup"
            git push
          fi

      - name: Keep 3X-UI alive and backup periodically
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          set -e

          while true; do
            echo
            echo "=============================================="
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 3X-UI heartbeat"
            echo "=============================================="

            if ! sudo systemctl is-active --quiet x-ui; then
              echo "3X-UI is not running."
              echo "Restarting..."

              sudo systemctl restart x-ui
              sleep 5
            fi

            if ! pgrep -x cloudflared > /dev/null; then
              echo "Cloudflare Tunnel is not running."
              echo "Restarting..."

              nohup cloudflared tunnel \
                --url http://127.0.0.1:2053 \
                > /tmp/cloudflared.log 2>&1 &

              sleep 10

              echo "Cloudflare Tunnel restarted."
            fi

            echo "Creating periodic backup..."

            sudo systemctl stop x-ui

            sudo rm -rf /tmp/xui-backup-work
            sudo rm -f /tmp/x-ui-backup.tar.gz

            sudo mkdir -p /tmp/xui-backup-work/etc
            sudo mkdir -p /tmp/xui-backup-work/root

            sudo cp -a /etc/x-ui \
              /tmp/xui-backup-work/etc/x-ui

            if [ -d /root/cert ]; then
              sudo cp -a /root/cert \
                /tmp/xui-backup-work/root/cert
            fi

            sudo tar \
              -czf /tmp/x-ui-backup.tar.gz \
              -C /tmp/xui-backup-work \
              .

            openssl enc \
              -aes-256-cbc \
              -pbkdf2 \
              -iter 600000 \
              -salt \
              -in /tmp/x-ui-backup.tar.gz \
              -out .xui-backup/x-ui-backup.tar.gz.enc \
              -pass "pass:$XUI_BACKUP_KEY"

            sha256sum \
              .xui-backup/x-ui-backup.tar.gz.enc \
              > .xui-backup/x-ui-backup.sha256

            sudo rm -rf /tmp/xui-backup-work
            sudo rm -f /tmp/x-ui-backup.tar.gz

            sudo systemctl start x-ui

            git add .xui-backup/

            if git diff --cached --quiet; then
              echo "No configuration changes."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "Update 3X-UI backup"

              git push

              echo "Backup pushed to repository."
            fi

            echo "Sleeping for 5 minutes..."

            sleep 300
          done

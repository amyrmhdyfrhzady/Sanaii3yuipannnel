name: 3X-UI Persistent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xui:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl openssl git

      - name: Check secrets
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
          XUI_PANEL_USERNAME: ${{ secrets.XUI_PANEL_USERNAME }}
          XUI_PANEL_PASSWORD: ${{ secrets.XUI_PANEL_PASSWORD }}
        run: |
          set -e

          if [ -z "$XUI_BACKUP_KEY" ]; then
            echo "ERROR: XUI_BACKUP_KEY secret is not configured."
            exit 1
          fi

          if [ -z "$XUI_PANEL_USERNAME" ]; then
            echo "ERROR: XUI_PANEL_USERNAME secret is not configured."
            exit 1
          fi

          if [ -z "$XUI_PANEL_PASSWORD" ]; then
            echo "ERROR: XUI_PANEL_PASSWORD secret is not configured."
            exit 1
          fi

          mkdir -p .xui-backup

          echo "All required secrets are configured."

      - name: Install 3X-UI
        env:
          XUI_NONINTERACTIVE: "1"
          XUI_SSL_MODE: "none"
        run: |
          set -e

          curl -fsSL \
            https://raw.githubusercontent.com/MHSanaei/3x-ui/main/install.sh \
            | sudo -E bash

      - name: Stop 3X-UI before restore
        run: |
          sudo systemctl stop x-ui || true

      - name: Restore previous configuration
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          set -e

          BACKUP=".xui-backup/x-ui-backup.tar.gz.enc"
          CHECKSUM=".xui-backup/x-ui-backup.sha256"

          if [ ! -f "$BACKUP" ]; then
            echo "=============================================="
            echo "No previous backup found."
            echo "This is the first 3X-UI run."
            echo "=============================================="
            exit 0
          fi

          if [ ! -f "$CHECKSUM" ]; then
            echo "ERROR: Backup checksum is missing."
            exit 1
          fi

          echo "Checking SHA-256..."

          sha256sum -c "$CHECKSUM"

          echo "Checksum OK."

          echo "Decrypting backup..."

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -in "$BACKUP" \
            -out /tmp/x-ui-backup.tar.gz \
            -pass "pass:$XUI_BACKUP_KEY"

          echo "Backup decrypted."

          echo "Restoring configuration..."

          sudo rm -rf /etc/x-ui
          sudo mkdir -p /etc/x-ui

          sudo tar \
            -xzf /tmp/x-ui-backup.tar.gz \
            -C /

          sudo chown -R root:root /etc/x-ui

          if [ -d /root/cert ]; then
            sudo chown -R root:root /root/cert
          fi

          sudo rm -f /tmp/x-ui-backup.tar.gz

          echo "=============================================="
          echo "Previous configuration restored."
          echo "=============================================="

      - name: Reset 3X-UI credentials
        env:
          XUI_PANEL_USERNAME: ${{ secrets.XUI_PANEL_USERNAME }}
          XUI_PANEL_PASSWORD: ${{ secrets.XUI_PANEL_PASSWORD }}
        run: |
          set -e

          echo "=============================================="
          echo "RESETTING 3X-UI CREDENTIALS"
          echo "=============================================="

          sudo systemctl stop x-ui || true

          sudo /usr/local/x-ui/x-ui setting -username "$XUI_PANEL_USERNAME" -password "$XUI_PANEL_PASSWORD" -resetTwoFactor=true

          echo "Username and password updated successfully."
          echo "Two-factor authentication reset successfully."

          sudo systemctl start x-ui

          sleep 5

          if ! sudo systemctl is-active --quiet x-ui; then
            echo "ERROR: x-ui failed to start."
            sudo journalctl -u x-ui --no-pager -n 100
            exit 1
          fi

          echo "3X-UI is running."

      - name: Read actual panel settings
        run: |
          set -e

          echo "=============================================="
          echo "3X-UI SETTINGS"
          echo "=============================================="

          sudo /usr/local/x-ui/x-ui setting -show true

          echo
          echo "=============================================="
          echo "INSTALL RESULT"
          echo "=============================================="

          if sudo test -f /etc/x-ui/install-result.env; then
            sudo cat /etc/x-ui/install-result.env
          else
            echo "install-result.env not found."
          fi

      - name: Verify 3X-UI login through API
        env:
          XUI_PANEL_USERNAME: ${{ secrets.XUI_PANEL_USERNAME }}
          XUI_PANEL_PASSWORD: ${{ secrets.XUI_PANEL_PASSWORD }}
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING 3X-UI LOGIN"
          echo "=============================================="

          PANEL_PORT=$(sudo /usr/local/x-ui/x-ui setting -show true 2>/dev/null \
            | sed -n 's/.*port:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            | tail -1)

          if [ -z "$PANEL_PORT" ]; then
            PANEL_PORT=2053
          fi

          echo "Detected panel port: $PANEL_PORT"

          BASE_PATH=$(sudo /usr/local/x-ui/x-ui setting -show true 2>/dev/null \
            | sed -n 's/.*webBasePath:[[:space:]]*\(.*\)/\1/p' \
            | tail -1 \
            | tr -d '\r')

          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi

          case "$BASE_PATH" in
            /*) ;;
            *) BASE_PATH="/$BASE_PATH" ;;
          esac

          BASE_PATH="${BASE_PATH%/}"

          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi

          echo "Detected web base path: $BASE_PATH"

          LOGIN_URL="http://127.0.0.1:${PANEL_PORT}${BASE_PATH}/login"

          if [ "$BASE_PATH" = "/" ]; then
            LOGIN_URL="http://127.0.0.1:${PANEL_PORT}/login"
          fi

          echo "Testing login endpoint..."

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/xui-login-response.json \
            -w "%{http_code}" \
            --max-time 20 \
            -c /tmp/xui-cookies.txt \
            -H "Content-Type: application/json" \
            -X POST \
            "$LOGIN_URL" \
            --data "$(python3 -c 'import json,os; print(json.dumps({"username":os.environ["XUI_PANEL_USERNAME"],"password":os.environ["XUI_PANEL_PASSWORD"]}))')")

          echo "HTTP status: $HTTP_CODE"

          echo "Login response:"

          cat /tmp/xui-login-response.json

          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: 3X-UI login HTTP request failed."
            exit 1
          fi

          if ! grep -q '"success"[[:space:]]*:[[:space:]]*true' /tmp/xui-login-response.json; then
            echo "ERROR: 3X-UI rejected the configured username/password."
            exit 1
          fi

          echo "=============================================="
          echo "3X-UI LOGIN TEST: SUCCESS"
          echo "=============================================="

      - name: Get panel access URL
        id: panel-url
        run: |
          set -e

          PANEL_PORT=$(sudo /usr/local/x-ui/x-ui setting -show true 2>/dev/null \
            | sed -n 's/.*port:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            | tail -1)

          if [ -z "$PANEL_PORT" ]; then
            PANEL_PORT=2053
          fi

          BASE_PATH=$(sudo /usr/local/x-ui/x-ui setting -show true 2>/dev/null \
            | sed -n 's/.*webBasePath:[[:space:]]*\(.*\)/\1/p' \
            | tail -1 \
            | tr -d '\r')

          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi

          case "$BASE_PATH" in
            /*) ;;
            *) BASE_PATH="/$BASE_PATH" ;;
          esac

          BASE_PATH="${BASE_PATH%/}"

          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi

          echo "PANEL_PORT=$PANEL_PORT" >> "$GITHUB_OUTPUT"
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "3X-UI PANEL"
          echo "=============================================="

          echo "Port: $PANEL_PORT"
          echo "Base path: $BASE_PATH"

      - name: Install cloudflared
        run: |
          set -e

          echo "=============================================="
          echo "INSTALLING CLOUDFLARED"
          echo "=============================================="

          curl -L \
            --fail \
            --show-error \
            --silent \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          set -e

          PANEL_PORT="${{ steps.panel-url.outputs.PANEL_PORT }}"

          echo "=============================================="
          echo "STARTING CLOUDFLARE QUICK TUNNEL"
          echo "=============================================="

          nohup cloudflared tunnel \
            --url "http://127.0.0.1:${PANEL_PORT}" \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > /tmp/cloudflared.pid

          TUNNEL_URL=""

          echo "Waiting for Cloudflare Tunnel..."

          for i in $(seq 1 30); do
            sleep 2

            TUNNEL_URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | tail -1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Cloudflare Tunnel URL was not detected."
            echo
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "=============================================="
          echo "CLOUDFLARE PANEL URL"
          echo "=============================================="

          echo "${TUNNEL_URL}${{ steps.panel-url.outputs.BASE_PATH }}"

          echo
          echo "=============================================="
          echo "CLOUDFLARE TUNNEL STATUS"
          echo "=============================================="

          ps -p "$CLOUDFLARED_PID"

      - name: Create initial backup
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          set -e

          sudo systemctl stop x-ui

          sudo rm -rf /tmp/xui-backup-work
          sudo rm -f /tmp/x-ui-backup.tar.gz

          sudo mkdir -p /tmp/xui-backup-work/etc
          sudo mkdir -p /tmp/xui-backup-work/root

          mkdir -p .xui-backup

          echo "Creating 3X-UI backup..."

          sudo cp -a /etc/x-ui \
            /tmp/xui-backup-work/etc/x-ui

          if [ -d /root/cert ]; then
            sudo cp -a /root/cert \
              /tmp/xui-backup-work/root/cert
          fi

          sudo tar \
            -czf /tmp/x-ui-backup.tar.gz \
            -C /tmp/xui-backup-work \
            .

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -salt \
            -in /tmp/x-ui-backup.tar.gz \
            -out .xui-backup/x-ui-backup.tar.gz.enc \
            -pass "pass:$XUI_BACKUP_KEY"

          sha256sum \
            .xui-backup/x-ui-backup.tar.gz.enc \
            > .xui-backup/x-ui-backup.sha256

          sudo rm -rf /tmp/xui-backup-work
          sudo rm -f /tmp/x-ui-backup.tar.gz

          sudo systemctl start x-ui

          echo "Initial backup completed."

      - name: Commit initial backup
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .xui-backup/

          if git diff --cached --quiet; then
            echo "No backup changes."
          else
            git commit -m "Update 3X-UI backup"
            git push
          fi

      - name: Keep 3X-UI alive and backup periodically
        env:
          XUI_BACKUP_KEY: ${{ secrets.XUI_BACKUP_KEY }}
        run: |
          set -e

          while true; do
            echo
            echo "=============================================="
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 3X-UI heartbeat"
            echo "=============================================="

            if ! sudo systemctl is-active --quiet x-ui; then
              echo "3X-UI is not running."
              echo "Restarting..."

              sudo systemctl restart x-ui
              sleep 5
            fi

            if ! pgrep -x cloudflared > /dev/null; then
              echo "Cloudflare Tunnel is not running."
              echo "Restarting..."

              PANEL_PORT=$(sudo /usr/local/x-ui/x-ui setting -show true 2>/dev/null \
                | sed -n 's/.*port:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
                | tail -1)

              if [ -z "$PANEL_PORT" ]; then
                PANEL_PORT=2053
              fi

              nohup cloudflared tunnel \
                --url "http://127.0.0.1:${PANEL_PORT}" \
                > /tmp/cloudflared.log 2>&1 &

              sleep 10

              echo "Cloudflare Tunnel restarted."
            fi

            echo "Creating periodic backup..."

            sudo systemctl stop x-ui

            sudo rm -rf /tmp/xui-backup-work
            sudo rm -f /tmp/x-ui-backup.tar.gz

            sudo mkdir -p /tmp/xui-backup-work/etc
            sudo mkdir -p /tmp/xui-backup-work/root

            sudo cp -a /etc/x-ui \
              /tmp/xui-backup-work/etc/x-ui

            if [ -d /root/cert ]; then
              sudo cp -a /root/cert \
                /tmp/xui-backup-work/root/cert
            fi

            sudo tar \
              -czf /tmp/x-ui-backup.tar.gz \
              -C /tmp/xui-backup-work \
              .

            openssl enc \
              -aes-256-cbc \
              -pbkdf2 \
              -iter 600000 \
              -salt \
              -in /tmp/x-ui-backup.tar.gz \
              -out .xui-backup/x-ui-backup.tar.gz.enc \
              -pass "pass:$XUI_BACKUP_KEY"

            sha256sum \
              .xui-backup/x-ui-backup.tar.gz.enc \
              > .xui-backup/x-ui-backup.sha256

            sudo rm -rf /tmp/xui-backup-work
            sudo rm -f /tmp/x-ui-backup.tar.gz

            sudo systemctl start x-ui

            git add .xui-backup/

            if git diff --cached --quiet; then
              echo "No configuration changes."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "Update 3X-UI backup"
              git push

              echo "Backup pushed to repository."
            fi

            echo "Sleeping for 5 minutes..."

            sleep 300
          done
